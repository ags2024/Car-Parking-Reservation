<!DOCTYPE html>
<html>
<head>
  <title>Caretaker Login | PARKiT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Poppins',sans-serif; background:#f6fafd;}
    .login-box{max-width:400px;margin:60px auto;background:#fff;border-radius:15px;padding:35px 24px;box-shadow:0 7px 28px #e6e6fb6a;}
    label{font-weight:600;}
    input{border-radius:9px;border:1px solid #aacefd;padding:10px;margin-bottom:7px;width:100%;}
    .btn{background:#1a73e8;color:#fff;padding:12px 0;font-weight:700;border:none;border-radius:9px;width:100%;font-size:1.08em;}
    .err{color:#a90c19;text-align:center;font-size:1em;}
  </style>
</head>
<body>
  <div class="login-box">
    <h2 style="text-align:center;">Caretaker Login</h2>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="POST">
      <label>Email:</label>
      <input type="text" name="email" required>
      <label>Password:</label>
      <input type="password" name="password" required>
      <button class="btn" type="submit">Login</button>
    </form>
  </div>
</body>
</html>

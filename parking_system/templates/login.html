<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PARKiT | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
  <header class="header">
    <div class="logo">🚗 PARKiT</div>
    <nav class="nav-links">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('login') }}" class="active">Login</a>
      <a href="{{ url_for('register') }}">Register</a>
    </nav>
  </header>

  <main class="auth-main">
    <div class="auth-container fade-up">
      <h2>Welcome Back</h2>
      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}
      <form method="POST" autocomplete="off">
        <label for="phone">Phone Number</label>
        <input type="text" id="phone" name="phone" pattern="[0-9]{10}" maxlength="10" required placeholder="Enter your phone">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Enter password">

        <button type="submit" class="btn-primary">Login</button>
        <p class="switch-link">No account yet? <a href="{{ url_for('register') }}">Register here</a></p>
      </form>
    </div>
  </main>

  <footer>
    <p>© 2025 <b>PARKiT</b> — Smartest way to park your car!</p>
  </footer>
</body>
</html>

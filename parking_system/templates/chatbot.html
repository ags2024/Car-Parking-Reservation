<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PARKiT | Assistant Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: #f6fafd; }
    .chatbot-container { max-width:420px; margin:50px auto; background:#fff; border-radius:22px; box-shadow:0 7px 38px #9ddbf310; }
    .chat-header { background:#1a73e8; color: #fff; padding:24px 20px 17px 24px; border-radius:22px 22px 0 0; font-weight:700; font-size:1.38em;}
    #chat-body { max-height:350px; overflow-y:auto; padding:17px 16px 0 24px; min-height:180px; }
    #chat-form { display:flex; padding:17px 21px 23px 21px; gap: 0.5em;}
    #chat-input { flex:1; border-radius:15px; border:1px solid #acd5fa; font-size:1.01em; padding:12px;}
    #chat-form button { padding:12px 25px; border-radius:15px; background:#26b9e4; color:#fff; font-weight:700; border:none;}
    .user-msg,.bot-msg {margin:7px 0;max-width:98%;}
    .user-msg {text-align:right;}
    .bot-msg {background: #e7f5fc; padding:10px 13px; border-radius:13px 14px 13px 4px; color:#206398;}
    .back-link { display: block; margin: 20px auto 0 auto; color: #1a73e8; text-align:center; text-decoration:underline; }
  </style>
</head>
<body>
  <div class="chatbot-container">
    <div class="chat-header">🤖 PARKiT Assistant</div>
    <div id="chat-body"></div>
    <form id="chat-form" onsubmit="return sendChatMsg();">
      <input type="text" id="chat-input" placeholder="Ask PARKiT..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>
  <a class="back-link" href="{{ url_for('user_dashboard') }}">← Back to Dashboard</a>
  <script>
    function sendChatMsg() {
      var input = document.getElementById("chat-input");
      var msg = input.value.trim();
      if (!msg) return false;
      var chatbody = document.getElementById("chat-body");
      chatbody.innerHTML += `<div class="user-msg"><b>You:</b> ` + msg + `</div>`;
      input.value = '';
      fetch('/chatbot_api', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ message: msg })
      })
      .then(r => r.json())
      .then(data => {
        chatbody.innerHTML += `<div class="bot-msg"><b>PARKiT:</b> ` + data.reply + `</div>`;
        chatbody.scrollTop = chatbody.scrollHeight;
      });
      chatbody.scrollTop = chatbody.scrollHeight;
      return false;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PARKiT | Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
  <header class="header">
    <div class="logo">🚗 PARKiT</div>
    <nav class="nav-links">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('login') }}">Login</a>
      <a href="{{ url_for('register') }}" class="active">Register</a>
    </nav>
  </header>

  <main class="auth-main">
    <div class="auth-container fade-up">
      <h2>Create Account</h2>
      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}
      <form method="POST" autocomplete="off">
        <label for="phone">Phone Number</label>
        <input type="text" id="phone" name="phone" pattern="[0-9]{10}" maxlength="10" required placeholder="Enter phone">

        <label for="email">Email</label>
        <input type="email" name="email" required placeholder="Email">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Enter password">

        <label for="car_type">Car Type</label>
        <select id="car_type" name="car_type" required>
          <option value="EV">EV</option>
          <option value="Fuel">Fuel</option>
        </select>

        <label for="car_number">Car Number</label>
        <input type="text" id="car_number" name="car_number" maxlength="10" required placeholder="e.g. KA09AB1234">

        <button type="submit" class="btn-primary">Register</button>
        <p class="switch-link">Already a user? <a href="{{ url_for('login') }}">Login here</a></p>
      </form>
    </div>
  </main>

  <footer>
    <p>© 2025 <b>PARKiT</b> — Smartest way to park

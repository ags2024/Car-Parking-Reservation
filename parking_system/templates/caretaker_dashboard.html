<!DOCTYPE html>
<html>
<head>
  <title>Caretaker Dashboard | PARKiT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Poppins',sans-serif;background:#f7fafd;}
    .main{max-width:740px;margin:40px auto;background:#fff;box-shadow:0 7px 28px #b7ddef42;padding:36px 34px;border-radius:15px;}
    h2{margin-bottom:17px;}
    .msg{background:#e8ffe6;color:#069142;padding:13px 19px;margin-bottom: 16px; border-radius:8px;}
    .ct-table{width:100%;border-collapse:collapse;margin-top:18px;}
    .ct-table th,.ct-table td{padding:10px 5px;border-bottom:1px solid #eaeaea;}
    select,button{border-radius:7px;padding:7px 9px;}
    button{background:#1a73e8;color:#fff;border:none;font-weight:700;cursor:pointer;}
    .status{font-weight:700;}
    .avail{color:#117821;}
    .booked{color:#c71b22;}
    .maint{color:#b98509;}
  </style>
</head>
<body>
  <div class="main">
    <h2>Welcome, {{ caretaker.name }}</h2>
    {% if msg %}<div class="msg">{{ msg }}</div>{% endif %}
    <div id="popup-alert" style="display:none;position:fixed;bottom:30px;right:40px;background:#fff1c2;color:#5b4d11;
border:2px solid #ecd881;border-radius:12px;padding:18px 23px;box-shadow:0 4px 32px #a4882553;z-index:99"></div>
<script>
function pollNotifications() {
  fetch('/admin/new_maintenance_notifications')
    .then(r => r.json()).then(data => {
      if(data.message){
        let alertDiv = document.getElementById('popup-alert');
        alertDiv.innerText = data.message;
        alertDiv.style.display = 'block';
        setTimeout(()=>{alertDiv.style.display='none';}, 10000);
      }
    });
}
setInterval(pollNotifications, 15000); // Every 15s
</script>

    <table class="ct-table">
      <tr>
        <th>Slot ID</th><th>Type</th><th>Status</th><th>Change Status</th>
      </tr>
      {% for s in slots %}
      <tr>
        <td>{{ s.slot_id }}</td>
        <td>{{ s.type }}</td>
        <td><span class="status {% if s.status=='available' %}avail{% elif s.status=='maintenance' %}maint{% elif s.status=='booked' %}booked{% endif %}">{{ s.status|capitalize }}</span></td>
        <td>
          <form method="POST" style="display:inline;">
            <input type="hidden" name="slot_id" value="{{ s.slot_id }}">
            <select name="new_status">
              <option value="available" {% if s.status == "available" %}selected{% endif %}>Available</option>
              <option value="maintenance" {% if s.status == "maintenance" %}selected{% endif %}>Maintenance</option>
              <option value="cleaning" {% if s.status == "cleaning" %}selected{% endif %}>Cleaning</option>
            </select>
            <button type="submit">Save</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </table>
  </div>
</body>
</html>
